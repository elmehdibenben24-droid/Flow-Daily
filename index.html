<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flow Daily - Premium Productivity</title>
    <style>
        :root {
            --bg-color: #0F172A;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #10B981;
            --primary-hover: #059669;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #1E293B, #0F172A);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            padding: 10px;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        button.add-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.add-btn:hover {
            background: var(--primary-hover);
        }

        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-text {
            font-size: 1.05rem;
            word-break: break-word;
            flex: 1;
            margin-right: 15px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .btn-check {
            color: var(--primary);
            background: rgba(16, 185, 129, 0.1);
        }

        .btn-delete {
            color: #EF4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .icon-btn:hover {
            transform: scale(1.1);
        }
        
        .stats {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Flow Daily</h1>
            <p>Secure. Fast. Distraction-free.</p>
        </header>

        <div class="input-wrapper">
            <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off">
            <button class="add-btn" onclick="addTask()">Add</button>
        </div>

        <ul class="task-list" id="taskList"></ul>
        
        <div class="stats" id="taskStats">0 tasks completed</div>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');
        const taskStats = document.getElementById('taskStats');
        
        // Security Feature: Prevent XSS attacks by escaping HTML characters
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        // Safe LocalStorage Loading
        let tasks = [];
        try {
            const savedData = localStorage.getItem('flowDaily_premium');
            if (savedData) tasks = JSON.parse(savedData);
        } catch (e) {
            console.error("Storage restricted or corrupted.");
        }

        function saveTasks() {
            try {
                localStorage.setItem('flowDaily_premium', JSON.stringify(tasks));
            } catch (e) {
                console.error("Could not save to storage.");
            }
            updateStats();
        }

        function renderTasks() {
            taskList.innerHTML = '';
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = `task-item ${task.completed ? 'completed' : ''}`;
                
                // Securely injecting the escaped task text
                const safeText = escapeHTML(task.text);
                
                li.innerHTML = `
                    <span class="task-text">${safeText}</span>
                    <div class="actions">
                        <button class="icon-btn btn-check" onclick="toggleTask(${index})">✓</button>
                        <button class="icon-btn btn-delete" onclick="deleteTask(${index})">✕</button>
                    </div>
                `;
                taskList.appendChild(li);
            });
            updateStats();
        }

        function addTask() {
            const rawText = taskInput.value.trim();
            if (rawText) {
                tasks.push({ text: rawText, completed: false });
                taskInput.value = '';
                saveTasks();
                renderTasks();
            }
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
        }
        
        function updateStats() {
            const completed = tasks.filter(t => t.completed).length;
            const total = tasks.length;
            taskStats.innerText = total === 0 ? "No tasks yet" : `${completed} of ${total} tasks completed`;
        }

        // Event Listener for Enter Key
        taskInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addTask();
        });

        // Initialize App
        renderTasks();
    </script>
</body>
</html>
